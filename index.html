<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="杜同学的暑期数学与物理学习记录" />
    <meta name="theme-color" content="#0071e3" />
    <title>杜同学 · 暑期学习记录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="返回页面顶部">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>
            <strong id="brand-name">好好学习</strong>
            <small>暑期学习档案</small>
          </span>
        </a>
        <div class="header-tools">
          <div class="countdown" aria-label="暑假开学倒计时">
            <span class="countdown-label">距开学</span>
            <strong id="countdown-value">--</strong>
            <span class="countdown-date" id="countdown-date">8月31日</span>
          </div>
          <div class="update-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="update-time">数据更新中</span>
          </div>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="profile-section" aria-labelledby="student-title">
        <div class="profile-copy">
          <h1 id="student-title">杜同学的学习记录</h1>
          <div class="profile-meta" aria-label="学生信息">
            <span id="student-grade">初二升初三</span>
            <span id="student-subjects">数学 · 物理· 化学</span>
          </div>
        </div>
      </section>

      <section class="calendar-section" aria-labelledby="calendar-heading">
        <div class="section-heading calendar-title-row">
          <div>
            <h2 id="calendar-heading">暑期课程日历</h2>
          </div>
          <div class="calendar-actions">
            <div class="month-switch" id="month-switch" aria-label="切换月份"></div>
          </div>
        </div>

        <div class="calendar-legend" aria-label="日历状态说明">
          <span><i class="legend-dot attended"></i>已上课</span>
          <span><i class="legend-dot missed"></i>未上课</span>
          <span><i class="legend-dot rest"></i>周末休息</span>
        </div>

        <div class="calendar-workspace">
          <div class="calendar-panel" id="calendar-panel">
            <div class="calendar-month-heading">
              <strong id="calendar-month-label">2026年7月</strong>
              <span id="calendar-month-summary">课程统计</span>
            </div>
            <div class="weekday-row" aria-hidden="true">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="课程日期"></div>
          </div>

          <aside class="day-panel" id="day-panel" aria-live="polite">
            <div class="day-panel-header">
              <div>
                <p class="eyebrow" id="selected-weekday">THURSDAY</p>
                <h3 id="selected-date">7月30日</h3>
              </div>
              <span class="day-status attended" id="selected-status">已上课</span>
            </div>
            <div id="selected-content"></div>
          </aside>
        </div>
      </section>

      <section class="records-section" aria-labelledby="records-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LESSON NOTES</p>
            <h2 id="records-heading">课程记录</h2>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>
        <div class="record-list" id="record-list"></div>
      </section>
    </main>

    <footer>
      <div>
        <strong id="footer-name">好好学习</strong>
        <span>每一次复盘，都让进步更清晰。</span>
      </div>
      <span>数学 · 物理 · 化学</span>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
