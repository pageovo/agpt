<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="杜同学的数学与物理课后学习记录" />
    <title>杜同学 · 学习记录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="返回页面顶部">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span class="brand-copy">
            <strong>向上学习</strong>
            <small>LEARNING RECORD</small>
          </span>
        </a>
        <div class="update-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="update-time">数据更新中</span>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="profile-section" aria-labelledby="student-title">
        <div class="profile-main">
          <div class="avatar" id="student-avatar" aria-hidden="true">杜</div>
          <div>
            <p class="eyebrow">STUDENT PROFILE</p>
            <h1 id="student-title">杜同学</h1>
            <div class="profile-meta">
              <span id="student-grade">初二升初三</span>
              <span id="student-subjects">数学 · 物理</span>
              <span id="student-start">7月15日开始</span>
            </div>
          </div>
        </div>
        <div class="goal-block">
          <span>本阶段学习目标</span>
          <p id="student-goal">学习目标加载中</p>
        </div>
      </section>

      <section class="summary" aria-label="学习概况">
        <article class="metric">
          <span>上课天数</span>
          <strong id="study-day-count">0<small> 天</small></strong>
        </article>
        <article class="metric">
          <span>双科记录</span>
          <strong id="lesson-count">0<small> 条</small></strong>
        </article>
        <article class="metric">
          <span>最近上课</span>
          <strong class="metric-date" id="latest-date">--</strong>
        </article>
        <article class="metric">
          <span>平均解决进度</span>
          <strong class="metric-progress" id="average-progress">待填写</strong>
        </article>
      </section>

      <section class="records-section" aria-labelledby="records-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LESSON ARCHIVE</p>
            <h2 id="records-heading">课后记录</h2>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>

        <div class="toolbar" aria-label="筛选课程记录">
          <label class="search-box">
            <span class="sr-only">搜索课程记录</span>
            <input id="search-input" type="search" placeholder="搜索课程内容、问题或评价" />
          </label>
          <div class="subject-filters" id="subject-filters" aria-label="按科目筛选"></div>
        </div>

        <div class="record-list" id="record-list"></div>
        <div class="empty-state" id="empty-state" hidden>
          <strong>没有找到相关记录</strong>
          <p>请更换关键词或筛选条件。</p>
        </div>
      </section>
    </main>

    <footer>
      <div>
        <strong id="footer-name">向上学习</strong>
        <span>每一次清晰的复盘，都在积累长期进步。</span>
      </div>
      <span>数学 · 物理</span>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
